[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietherb-mtl"
version = "0.1.0"
description = "Ethnopharmacology-informed multi-task learning for Vietnamese medicinal plants"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Minh Nhat" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<23",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "torch>=2.2,<3",
  "rdkit>=2023.9.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

